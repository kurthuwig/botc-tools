<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spielerblätter drucken</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend Deca', sans-serif;
      margin: 20px;
    }
    form {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background-color: #f9f9f9;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
    }
    input[type="submit"] {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
    }
    input[type="submit"]:hover {
      background-color: #45a049;
    }
  </style>
<body>
<form method="POST" action="http://localhost:8080/CGI-BIN/SHEETPRT.EXE">
  <div class="form-group">
    <label for="scriptName">Name:</label>
    <input type="text" id="scriptName" name="scriptName"/>
  </div>
  
  <div class="form-group">
    <label for="author">Author:</label>
    <input type="text" id="author" name="author"/>
  </div>
  
  <div class="form-group">
    <label for="scriptJson">JSON:</label>
    <textarea id="scriptJson" name="scriptJson" rows="10"></textarea>
  </div>

  <div class="form-group">
    <label for="language">Language:</label>
    <select id="language" name="language">
      <option value="de">German</option>
      <option value="en">English</option>
      <option value="sr">Serbian</option>
      <option value="sv">Swedish</option>
      <option value="tr">Turkish</option>
      <option value="vi">Vietnamese</option>
    </select>
  </div>

  <div class="form-group">
    <input type="checkbox" id="includeEnglishName" name="includeEnglishName" value="true" style="display: inline"/>
    <label for="includeEnglishName" style="display: inline">include English names</label>
  </div>
  <div class="form-group">
    <input type="submit" value="Player sheet"/>
  </div>
</form>
</body>
</html>
